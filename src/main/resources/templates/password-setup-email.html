<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set up your password</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellspacing="0" cellpadding="0"
                   style="max-width:480px;background:#ffffff;border-radius:8px;padding:32px;">
                <tr>
                    <td>
                        <h2 style="margin:0 0 16px;">Set up your password</h2>
                        <p>Hi <span th:text="${greetingName}">there</span>,</p>
                        <p>Use this code to add a password to your <span th:text="${appName}">App</span> account:</p>
                        <p style="font-size:32px;letter-spacing:6px;font-weight:bold;text-align:center;margin:24px 0;"
                           th:text="${code}">123456</p>
                        <p>The code expires in 5 minutes. If you didn't ask for this, you can ignore this email: no password will be set without the code.</p>
                        <p style="color:#6b7280;font-size:12px;margin-top:32px;">
                            &copy; <span th:text="${currentYear}">2026</span> <span th:text="${appName}">App</span>
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
