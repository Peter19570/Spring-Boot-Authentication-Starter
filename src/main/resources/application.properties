# Application Name
spring.application.name=${APP_NAME:auth-starter}

# Proxy Configuration
server.forward-headers-strategy=native

# Actuator Configuration
management.endpoints.web.exposure.include=${EXPOSED_ENDPOINTS:health,info}
management.endpoints.web.base-path=${BASE_URL:/actuator}
management.endpoint.health.show-details=never

# Swagger Configuration (set to false on production)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Pagination Configuration
spring.data.web.pageable.serialization-mode=via_dto
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=true

# Database Configuration (Postgres)
spring.datasource.url=${DATABASE_URL}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Generate Schema For Flyway
#spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
#spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=schema-new.sql

# CORS Origin Patterns Allowed - (In list, without the square brackets)
app.cors.allowed-origins=${CORS_ORIGINS_ALLOWED}

# JWT Configuration
jwt.token.secret.key=${JWT_SECRET}
jwt.token.access.token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION:PT15M}
jwt.token.refresh.token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION:P7D}

# Mail Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Frontend URL used in email links
app.mail.frontend-url=${MAIL_FRONTEND_URL}

# Passkey / WebAuthn Configuration
app.webauthn.allowed-origins=${WEBAUTHN_ALLOWED_ORIGINS}
app.webauthn.rp-id=${WEBAUTHN_RP_ID}

# Google ID Services Configuration
app.google.client.id=${GOOGLE_CLIENT_ID}

# Swagger / OpenAPI info (shown at the top of the docs page)
app.swagger.title=Authentication Starter
app.swagger.description=Reusable Spring Boot authentication module
app.swagger.version=1.0.0
# Optional contact: leave both blank to hide it
app.swagger.contact.name=
app.swagger.contact.email=